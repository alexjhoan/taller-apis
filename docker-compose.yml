version: "3.8"

services:
  mariadb:
    image: mariadb:10
    container_name: proyecto_php_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: MySuperSecureRootPassword123!
      MYSQL_DATABASE: taller
      MYSQL_USER: usuario_php
      MYSQL_PASSWORD: MiPasswordDeUsuarioSeguro456!
    ports:
      - "3306:3306" # Permite conectar DBeaver directamente a la IP del VPS
    volumes:
      - mariadb_data:/var/lib/mysql

  php_backend:
    build: ./
    container_name: proyecto_php_backend
    restart: always
    ports:
      - "8081:80"
    volumes:
      - backend_uploads:/var/www/html/assets/evidence
    environment:
      - DB_HOST=mariadb
      - DB_NAME=taller
      - DB_USER=usuario_php
      - DB_PASSWORD=MiPasswordDeUsuarioSeguro456!
      - VAPID_PUBLIC_KEY=BPR9RG5eDtJDFr4ZfO9Q6U1tx6AaiiJSr6fH1zASdZbJKTBkILRkCN-L2suPZBNqttPy7uzaiD0iiORnJcWWkWA
      - VAPID_PRIVATE_KEY=sBphxL9hlRIo7w1Cr8XUqf9YVu1sLXoIUrvwLiJT6A0
      - VAPID_SUBJECT=mailto:alexjhoan.25@gmail.com
    depends_on:
      - mariadb

volumes:
  mariadb_data:
  backend_uploads:
