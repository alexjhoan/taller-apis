version: "3.8"

services:
  mariadb:
    image: mariadb:10
    container_name: proyecto_php_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: MySuperSecureRootPassword123!
      MYSQL_DATABASE: taller
      MYSQL_USER: usuario_php
      MYSQL_PASSWORD: MiPasswordDeUsuarioSeguro456!
    ports:
      - "3306:3306" # Permite conectar DBeaver directamente a la IP del VPS
    volumes:
      - mariadb_data:/var/lib/mysql

  php_backend:
    build: ./
    container_name: proyecto_php_backend
    restart: always
    ports:
      - "8080:80"
    environment:
      - DB_HOST=mariadb
      - DB_NAME=taller
      - DB_USER=usuario_php
      - DB_PASSWORD=MiPasswordDeUsuarioSeguro456!
    depends_on:
      - mariadb

volumes:
  mariadb_data:
